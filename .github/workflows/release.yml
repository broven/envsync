name: Release

# Publish to npm when a version tag is pushed:
#   npm version patch   (bumps package.json + creates tag)
#   git push --follow-tags
#
# Auth: npm Trusted Publishing (OIDC) — no token required.
# Configured at: npmjs.com -> @metajs/envsync -> Settings -> Trusted Publisher
#   (GitHub repo: broven/envsync, workflow: release.yml)
on:
  push:
    tags: ['v*']

permissions:
  contents: write # create GitHub release
  id-token: write # npm trusted publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # node 24 ships npm >= 11.5.1, required for trusted publishing
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "${{ github.ref_name }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # prepublishOnly runs typecheck + test + build automatically
      - name: Publish to npm
        run: npm publish

      - name: Create GitHub release
        run: gh release create '${{ github.ref_name }}' --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
